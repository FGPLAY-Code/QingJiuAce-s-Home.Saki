<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网络工具合集 - 清久Aceの小窝</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="sakura-container"></div>
    
    <div class="app-container">
        <header class="app-header">
            <h1 class="title">网络工具合集</h1>
        </header>
        
        <nav class="tabs">
            <a href="/" class="tab">返回首页</a>
        </nav>
        
        <main class="content">
            <div id="tools" class="tab-content active">
                <div class="tools-grid" style="max-width: 800px; margin: 0 auto;">
                    {% for tool in tools %}
                    <a href="{{ tool.url }}" class="tool-card-link">
                        <div class="tool-card">
                            <h3 class="tool-name">{{ tool.name }}</h3>
                            <p class="tool-desc">{{ tool.description }}</p>
                        </div>
                    </a>
                    {% endfor %}
                </div>
            </div>
        </main>
    </div>
    
    <script src="/static/js/sakura.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
